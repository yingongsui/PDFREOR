name: Build Ubuntu Linux (desktop)

on:
  push:
    branches:
      - desktop
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Package Ubuntu .deb
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          ARCH=$(dpkg --print-architecture)
          case "$ARCH" in
            amd64) BUNDLE_DIR="build/linux/x64/release/bundle" ;;
            arm64) BUNDLE_DIR="build/linux/arm64/release/bundle" ;;
            *)
              echo "Unsupported 32-bit/non-64-bit Linux architecture: ${ARCH}"
              exit 1
              ;;
          esac

          rm -rf dist
          mkdir -p dist

          # Ubuntu .deb package
          PKG_ROOT="dist/deb_root"
          mkdir -p "${PKG_ROOT}/DEBIAN" \
                   "${PKG_ROOT}/opt/pdfreor" \
                   "${PKG_ROOT}/usr/bin" \
                   "${PKG_ROOT}/usr/share/applications" \
                   "${PKG_ROOT}/usr/share/icons/hicolor/512x512/apps" \
                   "${PKG_ROOT}/usr/share/icons/hicolor/scalable/apps"

          cp -r "${BUNDLE_DIR}/." "${PKG_ROOT}/opt/pdfreor/"
          chmod +x "${PKG_ROOT}/opt/pdfreor/PDFREOR"

          cat << 'EOF' > "${PKG_ROOT}/usr/bin/pdfreor"
          #!/bin/sh
          exec /opt/pdfreor/PDFREOR "$@"
          EOF
          chmod 755 "${PKG_ROOT}/usr/bin/pdfreor"

          cp assets/app_icon.png "${PKG_ROOT}/usr/share/icons/hicolor/512x512/apps/pdfreor.png"
          cp assets/app_icon_desktop.svg "${PKG_ROOT}/usr/share/icons/hicolor/scalable/apps/pdfreor.svg"

          cat << 'EOF' > "${PKG_ROOT}/usr/share/applications/pdfreor.desktop"
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=PDFREOR
          Comment=A fast, responsive PDF reader and annotation editor for desktop
          Exec=/opt/pdfreor/PDFREOR %F
          Icon=pdfreor
          Terminal=false
          Categories=Office;Viewer;Utility;
          MimeType=application/pdf;
          StartupWMClass=com.yin.pdfreor
          EOF

          cat << EOF > "${PKG_ROOT}/DEBIAN/control"
          Package: pdfreor
          Version: ${VERSION}
          Section: editors
          Priority: optional
          Architecture: ${ARCH}
          Depends: libgtk-3-0 | libgtk-3-0t64, xdg-utils
          Maintainer: PDFREOR Maintainers <https://github.com/yingongsui/PDFREOR>
          Description: A fast, responsive PDF reader and annotation editor for desktop.
          EOF

          dpkg-deb --build --root-owner-group "${PKG_ROOT}" "dist/PDFREOR-${VERSION}-ubuntu-${ARCH}.deb"
          rm -rf "${PKG_ROOT}"

      - name: Publish Ubuntu .deb to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          TAG="desktop-v${VERSION}"
          TITLE="PDFREOR-DESKTOP v${VERSION}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "Desktop builds for PDFREOR v${VERSION}." || true
          fi

          for attempt in 1 2 3; do
            if gh release upload "$TAG" dist/*.deb --clobber; then
              exit 0
            fi
            sleep 3
          done
          exit 1
