name: Build macOS (desktop)

on:
  push:
    branches:
      - desktop
  workflow_dispatch:

jobs:
  build_macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Build macOS release app
        run: flutter build macos --release

      - name: Package macOS app bundle
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/pdfreor.app \
            dist/pdfreor-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfreor-macos
          path: dist/pdfreor-macos.zip
          retention-days: 14
