name: Build macOS (desktop)

on:
  push:
    branches:
      - desktop
  workflow_dispatch:

jobs:
  build_macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test

      - name: Build macOS release app
        run: flutter build macos --release

      - name: Package macOS DMG
        run: |
          rm -rf dist/dmg_root
          mkdir -p dist/dmg_root
          ditto build/macos/Build/Products/Release/pdfreor.app dist/dmg_root/pdfreor.app
          ln -s /Applications dist/dmg_root/Applications
          hdiutil create \
            -volname "PDFREOR" \
            -srcfolder dist/dmg_root \
            -ov \
            -format UDZO \
            dist/pdfreor-macos.dmg
          rm -rf dist/dmg_root

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: pdfreor-macos
          path: dist/pdfreor-macos.dmg
          retention-days: 14
