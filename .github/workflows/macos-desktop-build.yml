name: Build macOS (desktop)

on:
  push:
    branches:
      - desktop
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test

      - name: Build macOS release app (Apple Silicon arm64)
        run: |
          flutter build macos --release
          ARCHS=$(lipo -archs build/macos/Build/Products/Release/PDFREOR.app/Contents/MacOS/PDFREOR)
          echo "Built macOS architectures: ${ARCHS}"
          if [ "$ARCHS" != "arm64" ]; then
            echo "Expected arm64-only binary, got: ${ARCHS}"
            exit 1
          fi

      - name: Package macOS DMG
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          rm -rf dist dist/dmg_root
          mkdir -p dist/dmg_root
          ditto build/macos/Build/Products/Release/PDFREOR.app dist/dmg_root/PDFREOR.app
          ln -s /Applications dist/dmg_root/Applications
          hdiutil create \
            -volname "PDFREOR" \
            -srcfolder dist/dmg_root \
            -ov \
            -format UDZO \
            "dist/PDFREOR-${VERSION}-macos-arm64.dmg"
          rm -rf dist/dmg_root

      - name: Publish macOS DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          TAG="desktop-v${VERSION}"
          TITLE="PDFREOR-DESKTOP v${VERSION}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "Desktop builds for PDFREOR v${VERSION}." || true
          fi

          for attempt in 1 2 3; do
            if gh release upload "$TAG" dist/*.dmg --clobber; then
              exit 0
            fi
            sleep 3
          done
          exit 1
