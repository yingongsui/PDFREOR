name: Build Windows (desktop)

on:
  workflow_dispatch:
    inputs:
      package_format:
        description: 'Windows package format to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - installer
          - zip

permissions:
  contents: write

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      PACKAGE_FORMAT: ${{ github.event.inputs.package_format || 'both' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test

      - name: Build Windows release app
        run: flutter build windows --release

      - name: Prepare dist directory
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "pubspec.yaml" -Pattern "^version:\s*([^+\r\n]+)" | Select-Object -First 1
          $version = $versionLine.Matches.Groups[1].Value.Trim()
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Path dist | Out-Null

      - name: Package portable ZIP
        if: ${{ env.PACKAGE_FORMAT == 'both' || env.PACKAGE_FORMAT == 'zip' }}
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "dist\PDFREOR-$($env:APP_VERSION)-windows-x64-portable.zip" `
            -Force

      - name: Package Inno Setup installer
        if: ${{ env.PACKAGE_FORMAT == 'both' || env.PACKAGE_FORMAT == 'installer' }}
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) {
              $iscc = $cmd.Source
            } else {
              choco install innosetup -y
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          }

          & $iscc `
            "/DMyAppVersion=$version" `
            "/DSourceDir=$PWD\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\dist" `
            "windows\packaging\pdfreor.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Move-Item -Force `
            -Path "dist\PDFREOR-windows-x64-setup.exe" `
            -Destination "dist\PDFREOR-$version-windows-x64-setup.exe"

      - name: Publish Windows packages to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:APP_VERSION
          $tag = "desktop-v$version"
          $title = "PDFREOR-DESKTOP v$version"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target "${{ github.sha }}" `
              --title $title `
              --notes "Desktop builds for PDFREOR v$version."
          }

          $files = Get-ChildItem -Path "dist" -File | ForEach-Object { $_.FullName }
          if (-not $files) {
            Write-Error "No release assets found in dist/"
            exit 1
          }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & gh release upload $tag @files --clobber
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 3
          }
          exit 1
