name: pdfreor
description: "A fast, responsive PDF reader and stylus annotation editor for Android tablets."
publish_to: 'none'

version: 2.4.0+2040

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  file_picker: ^13.3.2
  intl: ^0.20.3
  open_filex: ^5.0.0
  share_plus: ^13.3.1
  path: ^1.9.1
  crypto: ^3.0.8
  syncfusion_flutter_pdf: ^35.1.42
  pdfrx: ^2.4.8
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
